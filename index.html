<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080C0F" />

    <!-- Blog light/dark theme, applied before first paint so blog pages don't
         flash dark. Mirrors src/blog/theme.js (key "blog-theme", default light). -->
    <script>
      (function () {
        var p = location.pathname.toLowerCase();
        if (p !== "/blog" && p.indexOf("/blog/") !== 0) return;
        var t = "light";
        try { var s = localStorage.getItem("blog-theme"); if (s === "dark" || s === "light") t = s; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#FBFBF9" : "#080C0F");
      })();
    </script>

    <!-- type="image" is not a valid MIME type; browsers ignored the icon. -->
    <link rel="icon" type="image/webp" href="/ProfilePic.webp" />
    <link rel="apple-touch-icon" href="/ProfilePic.webp" />

    <!-- Inter is the first family in tailwind.config.js; without this it fell back to the system font.
         Source Serif 4 (article body) and JetBrains Mono (code) are used by the blog. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
    <link rel="alternate" type="application/rss+xml" title="Blog — Harsh Shah" href="/rss.xml" />

    <title>Harsh Shah — Software Product Engineer</title>
    <meta
      name="description"
      content="Harsh Shah — Software Product Engineer building products end to end, from PRD and system architecture through design, implementation and release."
    />
    <meta name="author" content="Harsh Shah" />

    <!-- Link previews (LinkedIn, X, Slack, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harsh Shah — Software Product Engineer" />
    <meta
      property="og:description"
      content="Building products end to end: PRD, system architecture, design and implementation."
    />
    <meta property="og:image" content="/ProfilePic.webp" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
