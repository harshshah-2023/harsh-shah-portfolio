    <circle cx="800" cy="190" r="56" stroke-opacity="0.8"/><circle cx="1010" cy="400" r="56" stroke-opacity="0.8"/>
    <circle cx="800" cy="610" r="56" stroke-opacity="0.8"/><circle cx="590" cy="400" r="56" stroke-opacity="0.8"/>
  </g>
  <g fill="#A9D7DF" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="800" y="198">Plan</text><text x="1010" y="408">Act</text><text x="800" y="618">Observe</text><text x="590" y="408">Reflect</text>
  </g>
