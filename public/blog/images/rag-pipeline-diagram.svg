<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="RAG pipeline: ingest documents, chunk and embed, store vectors; at query time embed the question, retrieve top-k, re-rank, then generate an answer with citations">
  <rect width="1200" height="420" rx="16" fill="#0B1115"/>
  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#D3DDE1" text-anchor="middle">
    <text x="70" y="40" text-anchor="start" fill="#808F96" font-size="14" letter-spacing="2">INDEXING (OFFLINE)</text>
    <text x="70" y="250" text-anchor="start" fill="#808F96" font-size="14" letter-spacing="2">QUERY (ONLINE)</text>
    <g fill="none" stroke="#468791" stroke-width="2">
      <rect x="70" y="70" width="190" height="80" rx="12"/><rect x="340" y="70" width="190" height="80" rx="12"/>
      <rect x="610" y="70" width="190" height="80" rx="12"/><rect x="880" y="70" width="250" height="80" rx="12" stroke="#80C1CC"/>
      <rect x="70" y="280" width="190" height="80" rx="12"/><rect x="340" y="280" width="190" height="80" rx="12"/>
      <rect x="610" y="280" width="190" height="80" rx="12"/><rect x="880" y="280" width="250" height="80" rx="12"/>
    </g>
    <text x="165" y="116">Documents</text><text x="435" y="116">Chunk</text><text x="705" y="116">Embed</text><text x="1005" y="116">Vector store</text>
    <text x="165" y="326">Question</text><text x="435" y="326">Retrieve top-k</text><text x="705" y="326">Re-rank</text><text x="1005" y="326">LLM + citations</text>
    <g stroke="#5DA4B1" stroke-width="2" fill="none">
      <path d="M260 110H340M530 110H610M800 110H880M260 320H340M530 320H610M800 320H880"/>
      <path d="M1005 150V230H435V280" stroke-dasharray="6 6"/>
    </g>
  </g>
</svg>
